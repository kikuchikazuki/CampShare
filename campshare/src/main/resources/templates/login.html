<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/campshare-favicon.svg}">
    <title>ログイン | CampShare</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <p class="auth-brand">CampShare</p>
    <h1>ログイン</h1>
    <p class="auth-alert" th:if="${param.error}">メールアドレスまたはパスワードが正しくありません。</p>
    <form class="auth-form" th:action="@{/login}" method="post">
        <div class="auth-field">
            <label for="email">メールアドレス</label>
            <input class="auth-input" id="email" name="email" type="email" required>
        </div>
        <div class="auth-field">
            <label for="password">パスワード</label>
            <input class="auth-input" id="password" name="password" type="password" required>
        </div>
        <button class="auth-submit" type="submit">ログイン</button>
    </form>
    <p class="auth-link">アカウントをお持ちでない方は <a th:href="@{/signup}">新規登録</a></p>
</main>
</body>
</html>
