<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/campshare-favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title th:text="${gear.name} + ' | CampShare'">CampShare</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body class="site-page">
<div th:replace="~{fragments/site-header :: siteHeader}"></div>
<main class="site-container">
    <a class="text-decoration-none" th:href="@{/gears}">← 用品一覧へ戻る</a>
    <article class="card shadow-sm mt-3 overflow-hidden">
        <div class="row g-0">
            <div class="col-md-6"><img class="w-100 h-100 object-fit-cover" style="min-height:300px" th:src="${gear.imageUrl}" th:alt="${gear.name}"></div>
            <div class="col-md-6"><div class="card-body p-4">
                <span class="badge text-bg-success" th:text="${gear.category}">カテゴリ</span>
                <h1 class="mt-3" th:text="${gear.name}">用品名</h1>
                <p class="text-muted" th:text="${gear.description}">説明</p>
                <p class="fs-4 fw-bold" th:text="|¥${gear.dailyPrice} / 日|">¥0 / 日</p>
                <p th:text="|残り在庫: ${gear.stockCount}|">残り在庫: 0</p>
                <a class="btn btn-success btn-lg" th:href="@{/gears/{id}/rentals/new(id=${gear.id})}">この用品を予約する</a>
            </div></div>
        </div>
    </article>
</main>
</body>
</html>
