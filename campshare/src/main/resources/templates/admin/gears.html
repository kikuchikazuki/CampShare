<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/site.css}"><title>商品管理 | CampShare</title></head><body class="site-page"><div th:replace="~{fragments/site-header :: siteHeader}"></div><main class="site-container"><div class="d-flex justify-content-between mt-3"><h1>商品管理</h1><div><a class="btn btn-outline-primary" th:href="@{/admin/dashboard}">ダッシュボード</a> <a class="btn btn-success" th:href="@{/admin/gears/new}">用品を追加</a></div></div><div class="alert alert-success mt-3" th:if="${param.created != null or param.updated != null or param.deleted != null}">変更を保存しました。</div><div class="alert alert-danger mt-3" th:if="${param.deleteError != null}">予約履歴があるため削除できません。</div><table class="table bg-white mt-3"><thead><tr><th>用品</th><th>日額</th><th>在庫</th><th></th></tr></thead><tbody><tr th:each="gear : ${gears}"><td th:text="${gear.name}">用品名</td><td th:text="|¥${gear.dailyPrice}|">¥0</td><td th:text="${gear.stockCount}">0</td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/gears/{id}/edit(id=${gear.id})}">編集</a><form class="d-inline" th:action="@{/admin/gears/{id}/delete(id=${gear.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">削除</button></form></td></tr></tbody></table></main></body></html>
