<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>商品管理 | CampShare</title></head><body class="bg-light"><main class="container py-5"><a th:href="@{/}">← トップへ戻る</a><div class="d-flex justify-content-between mt-3"><h1>商品管理</h1><a class="btn btn-success" th:href="@{/admin/gears/new}">用品を追加</a></div><div class="alert alert-success mt-3" th:if="${param.created != null or param.updated != null or param.deleted != null}">変更を保存しました。</div><div class="alert alert-danger mt-3" th:if="${param.deleteError != null}">予約履歴があるため削除できません。</div><table class="table bg-white mt-3"><thead><tr><th>用品</th><th>日額</th><th>在庫</th><th></th></tr></thead><tbody><tr th:each="gear:${gears}"><td th:text="${gear.name}"></td><td th:text="|¥${gear.dailyPrice}|"></td><td th:text="${gear.stockCount}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/gears/{id}/edit(id=${gear.id})}">編集</a><form class="d-inline" th:action="@{/admin/gears/{id}/delete(id=${gear.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">削除</button></form></td></tr></tbody></table></main></body></html>
