<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" th:href="@{/images/campshare-favicon.svg}"><link rel="stylesheet" th:href="@{/css/site.css}"><title>予約一覧 | CampShare</title></head><body class="site-page"><div th:replace="~{fragments/site-header :: siteHeader}"></div><main class="site-container"><a th:href="@{/admin/dashboard}">← ダッシュボードへ戻る</a><h1 class="mt-3 mb-4">予約一覧</h1><form class="row g-2 mb-4"><div class="col-md-5"><input class="form-control" name="userName" placeholder="利用者名" th:value="${userName}"></div><div class="col-md-5"><input class="form-control" name="gearName" placeholder="用品名" th:value="${gearName}"></div><div class="col-md-2 d-grid"><button class="btn btn-success">検索</button></div></form><table class="table bg-white"><thead><tr><th>利用者</th><th>用品</th><th>利用期間</th><th>金額</th></tr></thead><tbody><tr th:each="r : ${reservations}"><td th:text="${r.userName}">利用者</td><td th:text="${r.gearName}">用品</td><td th:text="${r.rentalPeriod}">期間</td><td th:text="|¥${r.totalPrice}|">¥0</td></tr><tr th:if="${#lists.isEmpty(reservations)}"><td colspan="4" class="text-muted">予約はありません。</td></tr></tbody></table></main></body></html>
