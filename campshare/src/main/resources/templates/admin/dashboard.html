<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" th:href="@{/images/campshare-favicon.svg}"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/site.css}"><title>管理ダッシュボード | CampShare</title></head>
<body class="site-page"><div th:replace="~{fragments/site-header :: siteHeader}"></div><main class="site-container"><a th:href="@{/admin/gears}">← 商品管理へ戻る</a><h1 class="mt-3 mb-4">管理ダッシュボード</h1>
<section class="card border-0 shadow-sm p-4 mb-4"><div class="d-flex justify-content-between align-items-start"><div><p class="text-muted mb-1">今月の予約売上</p><p class="display-5 mb-0" th:text="|¥${summary.currentMonthSales}|">¥0</p></div><span class="badge rounded-pill" th:classappend="${summary.salesIncreased()} ? 'text-bg-success' : 'text-bg-danger'" th:text="${summary.salesChangeLabel()}">前月比 -</span></div><p class="small mt-3 mb-0" th:classappend="${summary.hasPreviousMonthSales()} ? '' : 'text-muted'" th:text="${summary.salesDifferenceLabel()}">先月との差額</p></section>
<div class="row g-4"><div class="col-md-4"><a class="text-decoration-none text-reset" th:href="@{/admin/rentals}"><div class="card text-center p-4 h-100"><p>総予約件数</p><p class="display-5" th:text="${summary.rentalCount}">0</p><p>件<br><span class="small">予約一覧を見る</span></p></div></a></div><div class="col-md-4"><a class="text-decoration-none text-reset" th:href="@{/admin/rentals}"><div class="card text-center p-4 h-100"><p>累計予約売上</p><p class="display-5" th:text="|¥${summary.totalSales}|">¥0</p><p>予約一覧を見る</p></div></a></div><div class="col-md-4"><a class="text-decoration-none text-reset" th:href="@{/admin/gears/out-of-stock}"><div class="card text-center p-4 h-100"><p>在庫切れ用品</p><p class="display-5 text-danger" th:text="${summary.outOfStockCount}">0</p><p>件<br><span class="small">在庫切れ一覧を見る</span></p></div></a></div></div>
</main></body></html>
