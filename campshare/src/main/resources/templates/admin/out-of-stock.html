<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" th:href="@{/images/campshare-favicon.svg}"><link rel="stylesheet" th:href="@{/css/site.css}"><title>在庫切れ用品 | CampShare</title></head><body class="site-page"><div th:replace="~{fragments/site-header :: siteHeader}"></div><main class="site-container"><a th:href="@{/admin/dashboard}">← ダッシュボードへ戻る</a><h1 class="mt-3 mb-4">在庫切れ用品</h1><form class="row g-2 mb-4"><div class="col-md-5"><input class="form-control" name="gearName" placeholder="用品名" th:value="${gearName}"></div><div class="col-md-5"><input class="form-control" name="category" placeholder="カテゴリ" th:value="${category}"></div><div class="col-md-2 d-grid"><button class="btn btn-success">検索</button></div></form><table class="table bg-white"><thead><tr><th>用品</th><th>カテゴリ</th><th>在庫</th></tr></thead><tbody><tr th:each="g : ${gears}"><td th:text="${g.gearName}">用品</td><td th:text="${g.category}">カテゴリ</td><td class="text-danger" th:text="${g.stockCount}">0</td></tr><tr th:if="${#lists.isEmpty(gears)}"><td colspan="3" class="text-muted">在庫切れの用品はありません。</td></tr></tbody></table></main></body></html>
