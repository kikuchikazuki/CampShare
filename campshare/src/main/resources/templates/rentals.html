<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/campshare-favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>予約履歴 | CampShare</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body class="site-page">
<div th:replace="~{fragments/site-header :: siteHeader}"></div>
<main class="site-container">
    <h1 class="mt-3 mb-4">予約履歴</h1>
    <div class="alert alert-success" th:if="${param.reserved}">予約が完了しました！</div>
    <div class="card shadow-sm"><div class="card-body p-0">
        <div class="p-4 text-muted" th:if="${#lists.isEmpty(rentals)}">まだ予約はありません。</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(rentals)}">
            <table class="table table-hover mb-0">
                <thead><tr><th>用品</th><th>利用期間</th><th>料金</th><th>状態</th></tr></thead>
                <tbody><tr th:each="rental : ${rentals}">
                    <td th:text="${rental.gear.name}">用品名</td>
                    <td th:text="|${rental.startDate} 〜 ${rental.endDate}|">期間</td>
                    <td th:text="|¥${rental.totalPrice}|">¥0</td>
                    <td><span class="badge text-bg-success" th:text="${rental.status}">RESERVED</span></td>
                </tr></tbody>
            </table>
        </div>
    </div></div>
</main>
</body>
</html>
