<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>予約する | CampShare</title>
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 720px">
    <a class="text-decoration-none" th:href="@{/gears/{id}(id=${gear.id})}">← 商品詳細へ戻る</a>
    <section class="card shadow-sm mt-3"><div class="card-body p-4">
        <h1 class="h3">予約する</h1>
        <p><span class="fw-bold" th:text="${gear.name}">用品名</span> / <span th:text="|¥${gear.dailyPrice} / 日|">¥0 / 日</span></p>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <form th:action="@{/gears/{id}/rentals/new(id=${gear.id})}" th:object="${rentalForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="startDate">利用開始日</label>
                <input class="form-control" id="startDate" type="date" th:field="*{startDate}">
                <div class="text-danger small" th:errors="*{startDate}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="endDate">利用終了日（返却日）</label>
                <input class="form-control" id="endDate" type="date" th:field="*{endDate}">
                <div class="text-danger small" th:errors="*{endDate}"></div>
            </div>
            <button class="btn btn-success w-100" type="submit">予約を確定する</button>
        </form>
    </div></section>
</main>
</body>
</html>
