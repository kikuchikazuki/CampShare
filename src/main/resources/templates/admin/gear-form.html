<!DOCTYPE html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>用品編集 | CampShare</title></head><body class="bg-light"><main class="container py-5" style="max-width:720px"><a th:href="@{/admin/gears}">← 商品管理へ戻る</a><h1 class="mt-3" th:text="${gearId == null ? '用品を追加' : '用品を編集'}"></h1><form class="card p-4" th:object="${gearForm}" method="post" th:action="${gearId == null} ? @{/admin/gears} : @{/admin/gears/{id}(id=${gearId})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-2" th:each="field:${ {'name','category','description','dailyPrice','stockCount','imageUrl'} }"><label th:text="${field}"></label><input class="form-control" th:field="*{__${field}__}"><small class="text-danger" th:errors="*{__${field}__}"></small></div><button class="btn btn-success mt-3">保存する</button></form></main></body></html>
